<!-- Justif: Knuth-Plass paragraph justification, upgrading any element with
     text-align: justify (opt-in via the .text-justify class in
     _sass/_utilities.scss, applied selectively to verified-safe prose
     paragraphs). Self-hosted (vendored from justif@0.9.1) rather than
     CDN-loaded. Must load before first paint so justified text doesn't
     visibly reflow after render. -->
<script type="module" blocking="render" data-justif-selector="p:not(.research-interest-justified), li, dd, blockquote, figcaption" src="{{ base_path }}/assets/js/justif/dist/auto.js"></script>

<!-- NOTE: the inline scripts below must use block comments, never line
     comments. compress_html (_config.yml, active in production but disabled
     for the development env) strips newlines, so a line comment silently
     swallows the rest of the script once it is all on one line. That is a
     production-only failure the dev server cannot reproduce.

     Abstract <p> elements live inside collapsed <details> blocks, so Justif's
     initial scan declines them as "not rendered". Only rescan() reconsiders
     declined paragraphs — refresh() just relayouts the ones already owned,
     so it can never pick these up. The toggle event fires before the
     revealed content is laid out, hence the two frames of delay.

     For the resize listener: _reset.scss steps the root font-size at each
     breakpoint (16px / 18px / 112% / 130%), so resizing across one changes
     every paragraph's computed font size. Justif caches per-paragraph font
     metrics from its initial scan and cannot observe that, so the cache goes
     stale and paragraphs relayout to roughly 86% of their box — short lines
     and colliding glyphs, stuck until a reload. rescan() re-reads author CSS
     and fixes it; refresh() relayouts against the stale cache and measurably
     does nothing. This is unrelated to resize speed: a slow drag across a
     breakpoint breaks it identically, and a fast drag within one is fine. -->
<script>
document.addEventListener('toggle', function (e) {
  if (e.target.tagName === 'DETAILS' && e.target.open && window.justif && window.justif.booted) {
    window.justif.booted.then(function () {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          for (var c of window.justif.controllers) { c.rescan(); }
        });
      });
    });
  }
}, true);

(function () {
  var timer = null;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (window.justif && window.justif.booted) {
        window.justif.booted.then(function () {
          for (var c of window.justif.controllers) { c.rescan(); }
        });
      }
    }, 250);
  });
})();
</script>

<!-- Google Fonts: preconnect first, then non-render-blocking stylesheet link.
     Using <link> instead of CSS @import avoids blocking the render-critical stylesheet parse. -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Preload the self-hosted fonts actually needed early, so they start
     fetching immediately instead of waiting for CSS/layout to discover
     them — that discovery delay is most of what causes a visible font
     swap. CrimsonProSC-SemiBold is deliberately left out: it's only used
     once, deep in the page, so preloading it would just compete for
     bandwidth with things that matter for the initial view. -->
<link rel="preload" href="/assets/fonts/crimson-pro-sc/CrimsonProSC-ExtraLight.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/assets/fonts/crimson-pro-sc/CrimsonProSC-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/assets/fonts/crimson-pro-sc/CrimsonProSC-RegularItalic.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/assets/fonts/crimson-pro-sc/CrimsonProSC-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/assets/fonts/sentient/Sentient-Italic.woff2" as="font" type="font/woff2" crossorigin>

<!-- Research Interests uses a separate Justif controller. Its mixed serif and
     sans-serif runs are measured only after the relevant web fonts are ready;
     the automatic scan above handles the rest of the page. -->
<script type="module">
(function () {
  var html = document.documentElement;
  var researchController = null;
  var researchControllerReady = false;
  function reveal() {
    html.classList.remove('fonts-loading');
    html.classList.add('fonts-loaded');
  }
  function refreshJustif() {
    if (!window.justif) { return Promise.resolve(); }
    return window.justif.booted.then(function () {
      return new Promise(function (resolve) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            for (var c of window.justif.controllers) { c.refresh(); }
            if (researchControllerReady) { researchController.refresh(); }
            requestAnimationFrame(function () {
              requestAnimationFrame(resolve);
            });
          });
        });
      });
    });
  }
  var cssReady = Promise.all(Array.from(document.querySelectorAll('link[rel="stylesheet"]'), function (css) {
    if (css.sheet || document.readyState === 'complete') { return Promise.resolve(); }
    return new Promise(function (resolve) {
      css.addEventListener('load', resolve, { once: true });
      css.addEventListener('error', resolve, { once: true });
      window.addEventListener('load', resolve, { once: true });
    });
  }));
  var fontsReady = cssReady.then(function () {
    if (!('fonts' in document)) { return; }
    return Promise.allSettled([
      document.fonts.load('200 1em "Crimson Pro SC"'),
      document.fonts.load('400 1em "Crimson Pro SC"'),
      document.fonts.load('italic 400 1em "Crimson Pro SC"'),
      document.fonts.load('500 1em "Crimson Pro SC"'),
      document.fonts.load('800 1em "Martel Sans"'),
      document.fonts.load('italic 550 1em "SentientAmp"'),
      document.fonts.ready
    ]);
  });
  var justifReady = (window.justif && window.justif.booted) || Promise.resolve();
  var hyphenatorReady = import('{{ base_path }}/assets/js/justif/dist/hyphenate/en-us.js')
    .then(function (module) { return module.hyphenateEnUS; }, function () { return null; });
  var ready = Promise.all([fontsReady, justifReady, hyphenatorReady]).then(function (results) {
    if (!window.justif) { return; }
    var paragraphs = document.querySelectorAll('.research-interest-justified');
    var options = {
      spacing: { shrink: 0 },
      tracking: false,
      expansion: false,
      protrusion: false,
      hangingPunctuation: 'none'
    };
    if (results[2]) { options.hyphenate = results[2]; }
    researchController = window.justif.justify(paragraphs, options);
    return researchController.ready.then(function () {
      researchControllerReady = true;
    });
  }).then(refreshJustif).then(function () {
    html.classList.remove('research-justif-loading');
  }, function () {
    researchControllerReady = false;
    if (researchController) { researchController.destroy(); }
    researchController = null;
    html.classList.remove('research-justif-loading');
  });
  if ('fonts' in document && document.fonts.addEventListener) {
    document.fonts.addEventListener('loadingdone', refreshJustif);
  }
  window.addEventListener('load', refreshJustif, { once: true });
  var researchResizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(researchResizeTimer);
    researchResizeTimer = setTimeout(function () {
      ready.then(function () {
        if (researchController) { researchController.rescan(); }
      });
    }, 250);
  });
  var timeout = new Promise(function (resolve) { setTimeout(resolve, 1000); });
  Promise.race([ready, timeout]).then(reveal, reveal);
})();
</script>
