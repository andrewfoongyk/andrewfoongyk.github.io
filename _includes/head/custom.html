<!-- start custom head snippets -->

<!-- Justif: Knuth-Plass paragraph justification, upgrading any element with
     text-align: justify (opt-in via the .text-justify class in
     _sass/_utilities.scss, applied selectively to verified-safe prose
     paragraphs). Self-hosted (vendored from justif@0.9.1) rather than
     CDN-loaded. Must load before first paint so justified text doesn't
     visibly reflow after render. -->
<script type="module" blocking="render" src="{{ base_path }}/assets/js/justif/dist/auto.js"></script>

<!-- Abstract <p> elements live inside collapsed <details> blocks, so they
     have zero width when Justif's initial scan runs. Force a refresh of
     all controllers whenever any <details> is opened, so the abstract
     text is correctly measured and justified once it's actually visible. -->
<script>
document.addEventListener('toggle', function (e) {
  if (e.target.tagName === 'DETAILS' && e.target.open && window.justif && window.justif.booted) {
    window.justif.booted.then(function () {
      for (var c of window.justif.controllers) { c.refresh(); }
    });
  }
}, true);

// _reset.scss steps the root font-size at each breakpoint (16px / 18px /
// 112% / 130%), so resizing across one changes every paragraph's computed
// font size. Justif caches per-paragraph font metrics from its initial scan
// and has no way to observe that, so the cache goes stale and every
// paragraph relayouts to roughly 86% of its box — short lines in a wide
// column, stuck that way until a reload.
//
// rescan() is the fix because it re-reads author CSS; refresh() only
// relayouts against the stale cache and measurably does nothing here. This
// is unrelated to resize speed — a slow drag across a breakpoint breaks it
// identically, and a fast drag within one breakpoint is fine.
(function () {
  var timer = null;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (window.justif && window.justif.booted) {
        window.justif.booted.then(function () {
          for (var c of window.justif.controllers) { c.rescan(); }
        });
      }
    }, 250);
  });
})();
</script>

<!-- Hide the page until fonts are ready (see _custom.scss), then fade in.
     Must run blocking/synchronous, before anything paints. -->
<script>document.documentElement.classList.add('fonts-loading');</script>

<!-- Google Fonts: preconnect first, then non-render-blocking stylesheet link.
     Using <link> instead of CSS @import avoids blocking the render-critical stylesheet parse. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Martel+Sans:wght@200;300;400;600;700;800;900&display=swap">

<!-- Preload the self-hosted fonts actually needed early, so they start
     fetching immediately instead of waiting for CSS/layout to discover
     them — that discovery delay is most of what causes a visible font
     swap. CrimsonProSC-SemiBold is deliberately left out: it's only used
     once, deep in the page, so preloading it would just compete for
     bandwidth with things that matter for the initial view. -->
<link rel="preload" href="/assets/fonts/crimson-pro-sc/CrimsonProSC-ExtraLight.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/assets/fonts/crimson-pro-sc/CrimsonProSC-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/assets/fonts/crimson-pro-sc/CrimsonProSC-RegularItalic.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/assets/fonts/crimson-pro-sc/CrimsonProSC-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/assets/fonts/sentient/Sentient-Italic.woff2" as="font" type="font/woff2" crossorigin>

<!-- Reveal the page (see fonts-loading/fonts-loaded in _custom.scss) once
     the critical fonts above AND Justif's initial justification pass are
     both ready, or after 1000ms, whichever is first — so a slow/failed
     font or script fetch can never leave the page hidden indefinitely.
     type="module" (not a plain classic script) so this runs after the
     Justif module above finishes — module/deferred scripts execute in
     document order after parsing, so window.justif is guaranteed to
     exist by the time this reads it. -->
<script type="module">
(function () {
  var html = document.documentElement;
  function reveal() {
    html.classList.remove('fonts-loading');
    html.classList.add('fonts-loaded');
  }
  var fontsReady = ('fonts' in document) ? Promise.all([
    document.fonts.load('200 1em "Crimson Pro SC"'),
    document.fonts.load('400 1em "Crimson Pro SC"'),
    document.fonts.load('italic 400 1em "Crimson Pro SC"'),
    document.fonts.load('500 1em "Crimson Pro SC"'),
    document.fonts.load('italic 550 1em "SentientAmp"')
  ]) : Promise.resolve();
  var justifReady = (window.justif && window.justif.booted) || Promise.resolve();
  var ready = Promise.all([fontsReady, justifReady]);
  var timeout = new Promise(function (resolve) { setTimeout(resolve, 1000); });
  Promise.race([ready, timeout]).then(reveal, reveal);
})();
</script>
