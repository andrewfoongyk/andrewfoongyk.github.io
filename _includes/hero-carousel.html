{% assign hc_variant = include.variant | default: "desktop" %}
<div class="hero-banner hero-banner--{{ hc_variant }} hero-carousel" role="group" aria-roledescription="carousel" aria-label="Hero images">
  <div class="hero-carousel__viewport">
    {% for slide in page.hero_slides %}
    <figure class="hero-carousel__slide{% if forloop.first %} is-active{% endif %}" data-caption="{{ slide.caption }}">
      <a href="{{ slide.link }}"{% if slide.external %} target="_blank" rel="noopener"{% endif %}>
        <img src="{{ slide.image }}" alt="{{ slide.alt }}" width="1968" height="799"{% if forloop.first %} loading="eager"{% else %} loading="lazy"{% endif %}>
      </a>
    </figure>
    {% endfor %}
    <button type="button" class="hero-carousel__arrow hero-carousel__arrow--prev" aria-label="Previous image">&#8249;</button>
    <button type="button" class="hero-carousel__arrow hero-carousel__arrow--next" aria-label="Next image">&#8250;</button>
  </div>
  <figcaption class="hero-carousel__caption">{{ page.hero_slides.first.caption }}</figcaption>
</div>
